<div
  class="column"
  [attr.data-status]="status"
  [class.drag-over]="isDragOver()"
  (dragenter)="onDragEnter($event)"
  (dragleave)="onDragLeave()"
  (dragover)="onDragOver($event)"
  (drop)="onDrop($event)"
>
  <div class="column-header">
    <div class="column-title-group">
      <span class="column-title">{{ title }}</span>
      <span class="status-dot"></span>
    </div>
    <span class="count-badge">{{ tasks.length }}</span>
    <button class="add-btn" (click)="addTask.emit(status)" [attr.aria-label]="i18n.t('column.add')">
      +
    </button>
  </div>

  <div class="task-list">
    @if (tasks.length === 0) {
      <div class="empty-state">{{ i18n.t('column.empty') }}</div>
    }
    @for (task of tasks; track task.id; let i = $index) {
      @if (dropIndex() === i) {
        <div class="drop-line" aria-hidden="true"></div>
      }
      <div class="card-slot" (dragover)="onCardDragOver($event, i)">
        <app-task-card [task]="task" (editTask)="editTask.emit($event)" />
      </div>
    }
    @if (dropIndex() !== null && dropIndex() === tasks.length && tasks.length > 0) {
      <div class="drop-line" aria-hidden="true"></div>
    }
  </div>
</div>
