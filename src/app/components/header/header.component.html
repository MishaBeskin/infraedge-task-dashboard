<header class="header">
  <!-- RIGHT: logo + divider + title (first in DOM = right in RTL) -->
  <div class="header-right">
    <!-- Logo — rightmost in RTL (first in DOM) -->
    <div class="logo-block">
      <span class="logo"><span class="logo-dot">●</span> stack</span>
    </div>

    <div class="header-divider"></div>

    <!-- Title — left of divider. Single page-level <h1> wraps both edit states. -->
    <div class="title-block">
      <h1 class="board-title">
        @if (editing()) {
          <input
            #titleInput
            class="board-title__input"
            type="text"
            maxlength="60"
            [value]="draft()"
            [placeholder]="i18n.t('board.name.placeholder')"
            [attr.aria-label]="i18n.t('board.name.placeholder')"
            [style.inline-size.ch]="draftWidthCh()"
            (input)="draft.set($any($event.target).value)"
            (keydown.enter)="commit()"
            (keydown.escape)="cancel()"
            (blur)="commit()"
          />
        } @else {
          <button
            #titleButton
            type="button"
            class="board-title__btn"
            [attr.aria-label]="i18n.t('board.rename')"
            (click)="startEdit()"
          >
            {{ displayTitle }}
          </button>
        }
      </h1>
      <p class="board-subtitle">{{ taskCount }} {{ i18n.t('header.subtitle') }}</p>
    </div>
  </div>

  <!-- LEFT: user menu (last in DOM = left in RTL) -->
  <div class="header-left">
    <app-user-menu />
  </div>
</header>
