<div
  class="task-card"
  [class.is-updating]="isUpdating()"
  [class.is-dragging]="isDragging()"
  [attr.data-priority]="task.priority"
  draggable="true"
  (dragstart)="onDragStart($event)"
  (dragend)="onDragEnd()"
>
  <div class="card-body">
    <div class="card-title-row">
      <button
        class="drag-handle"
        type="button"
        [attr.aria-label]="i18n.t('card.drag')"
        (pointerdown)="onHandlePointerDown($event)"
        (pointermove)="onHandlePointerMove($event)"
        (pointerup)="onHandlePointerUp($event)"
        (pointercancel)="onHandlePointerCancel($event)"
        (lostpointercapture)="onHandlePointerCancel($event)"
      >
        <svg width="12" height="16" viewBox="0 0 12 16" fill="currentColor" aria-hidden="true">
          <circle cx="3" cy="3" r="1.5" />
          <circle cx="9" cy="3" r="1.5" />
          <circle cx="3" cy="8" r="1.5" />
          <circle cx="9" cy="8" r="1.5" />
          <circle cx="3" cy="13" r="1.5" />
          <circle cx="9" cy="13" r="1.5" />
        </svg>
      </button>
      <p class="card-title">{{ task.title }}</p>
      <button
        class="edit-btn"
        (click)="editTask.emit(task)"
        [attr.aria-label]="i18n.t('card.edit')"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="13"
          height="13"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
        </svg>
      </button>
    </div>
    @if (task.description) {
      <p class="card-description">{{ task.description }}</p>
    }
    <span class="priority-badge" [attr.data-priority]="task.priority">
      <span class="badge-dot"></span>{{ priorityLabel }}
    </span>
  </div>

  <div class="card-divider"></div>

  <div class="card-footer">
    <!-- Status select — RIGHT in RTL (first in DOM) -->
    <div class="status-select-wrapper" [attr.data-status]="task.status">
      <span class="status-dot"></span>
      <select [value]="task.status" (change)="onStatusChange($event)" [disabled]="isUpdating()">
        <option value="todo">{{ i18n.t('status.todo') }}</option>
        <option value="in-progress">{{ i18n.t('status.in-progress') }}</option>
        <option value="done">{{ i18n.t('status.done') }}</option>
      </select>
    </div>

    <!-- Delete — LEFT in RTL (last in DOM) -->
    @if (showDeleteConfirm()) {
      <button class="delete-btn delete-btn--confirm" (click)="onDeleteClick()">
        <span>{{ i18n.t('card.deleteConfirm') }}</span>
        <svg class="countdown-ring" width="18" height="18" viewBox="0 0 18 18">
          <circle class="ring-track" cx="9" cy="9" r="7" />
          <circle class="ring-fill" cx="9" cy="9" r="7" />
        </svg>
      </button>
    } @else {
      <button
        class="delete-btn"
        (click)="onDeleteClick()"
        [attr.aria-label]="i18n.t('card.delete')"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="13"
          height="13"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <polyline points="3 6 5 6 21 6" />
          <path d="M19 6l-1 14H6L5 6" />
          <path d="M10 11v6" />
          <path d="M14 11v6" />
          <path d="M9 6V4h6v2" />
        </svg>
      </button>
    }
  </div>

  @if (deleteError()) {
    <p class="card-error" role="alert">{{ i18n.t(deleteError()!) }}</p>
  }
</div>
